# Bezpłatny Render + osobny trwały PostgreSQL Supabase (Free).
# Uwaga: Render Free zasypia i nie zapewnia 24/7 dostępności.
services:
  - type: web
    name: arena-polanow
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        sync: false  # Wpisz sekretny Session Pooler URI w panelu Render; nigdy w GitHub.
